name: backtest
# Ręcznie (Actions -> backtest -> Run workflow) i co niedzielę.
on:
  workflow_dispatch:
    inputs:
      period:
        description: "Okres danych (np. 2y, 5y)"
        default: "2y"
  schedule:
    - cron: "17 9 * * 0"

permissions:
  contents: write

concurrency:
  group: gielda-max-state
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testy
        env: { PYTHONPATH: src }
        run: python -m unittest discover -s tests
      - name: Backtest
        env: { PYTHONPATH: src }
        run: python -m gm.backtest "${{ github.event.inputs.period || '2y' }}"
      - name: Zapis wyniku
        run: |
          git config user.name "gielda-max-bot"
          git config user.email "gielda-max-bot@users.noreply.github.com"
          git add -A reports/backtest
          git diff --cached --quiet && exit 0
          git commit -m "backtest $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 7; done
          exit 1
