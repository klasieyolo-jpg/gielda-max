name: diag
# Ręcznie (Actions -> backtest -> Run workflow) i co niedzielę.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gielda-max-state
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Research
        env: { PYTHONPATH: src }
        run: mkdir -p reports/diag && python -m gm.diag > reports/diag/LATEST.txt 2>&1; tail -60 reports/diag/LATEST.txt
      - name: Zapis wyniku
        run: |
          git config user.name "gielda-max-bot"
          git config user.email "gielda-max-bot@users.noreply.github.com"
          git add -A reports/diag
          git diff --cached --quiet && exit 0
          git commit -m "diag $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 7; done
          exit 1
