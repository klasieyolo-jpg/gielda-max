name: smoke
# Ręcznie (Actions -> backtest -> Run workflow) i co niedzielę.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gielda-max-state
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Smoke
        env: { PYTHONPATH: src }
        run: T=$(mktemp -d); cp -r config commands $T/; GM_ROOT=$T GM_SMOKE=1 python -m gm.run > reports/diag/SMOKE.txt 2>&1; echo EXIT=$? >> reports/diag/SMOKE.txt; cat $T/reports/LATEST.md >> reports/diag/SMOKE.txt 2>&1; tail -n 40 $T/data/decisions.jsonl >> reports/diag/SMOKE.txt 2>&1; cat reports/diag/SMOKE.txt
      - name: Zapis wyniku
        run: |
          git config user.name "gielda-max-bot"
          git config user.email "gielda-max-bot@users.noreply.github.com"
          git add -A reports/diag
          git diff --cached --quiet && exit 0
          git commit -m "smoke $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 7; done
          exit 1
